# The staging CCTP bridge's instance unit: the ConfigMap the bridge mounts at
# /etc/mirror/. Unlike the manual instances, BOTH files are committed
# (staging boots from git alone). The name suffix is disabled:
# k8s/stg/diorama-cctp-bridge-deployment.yaml (applied by the cicd pipeline
# outside kustomize) references the plain name.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

configMapGenerator:
  - name: cctp-instance
    files:
      - instance.toml=instance.toml
      - specialization.toml=specialization.toml
    options:
      disableNameSuffixHash: true
