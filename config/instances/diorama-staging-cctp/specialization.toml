# The STAGING CCTP bridge specialization: fully committed (the generic
# `specialization.toml` is deployment data elsewhere; this deployment must
# boot from git alone, so the file lives here). The tracked template's
# chain/lane topology verbatim: both chains are the staging anvils, reached
# over same-namespace short DNS via the ${T_RPC_URL}/${ANVIL_V_URL} wiring.
[endpoints.t_rpc]
http = ["${T_RPC_URL}"]
chain_id = 1

[endpoints.anvil_v]
http = ["${ANVIL_V_URL}"]
chain_id = 999

[[services.cctp_bridge.chains]]
id = "ethereum"
family = "ethereum"
chain_id = 1
domain = 0
rpc_urls = "@t_rpc"
usdc = "0xA0b86991c6218b36c1d19D4a2e9Eb0cE3606eB48"
token_messenger = "0x28b5a0e9C621a5BadaA536219b3a228C8168cf5d"
message_transmitter = "0x81D40F21F12A8F0E3252Bccb954D722d4c464B64"
token_minter = "0xfd78EE919681417d192449715b2594ab58f5D002"

[[services.cctp_bridge.chains]]
id = "hyperevm"
family = "hyperliquid"
chain_id = 999
domain = 19
rpc_urls = "@anvil_v"
usdc = "0xb88339CB7199b77E23DB6E890353E22632Ba630f"
token_messenger = "0x28b5a0e9C621a5BadaA536219b3a228C8168cf5d"
message_transmitter = "0x81D40F21F12A8F0E3252Bccb954D722d4c464B64"
token_minter = "0xfd78EE919681417d192449715b2594ab58f5D002"

[[services.cctp_bridge.lanes]]
source = "ethereum"
destination = "hyperevm"
# The measured Iris table for this lane: fast burns cost 1 unit at
# threshold 1000; standard is free.
fees = [
  { finalityThreshold = 1000, minimumFee = 1 },
  { finalityThreshold = 2000, minimumFee = 0 },
]

[[services.cctp_bridge.lanes]]
source = "hyperevm"
destination = "ethereum"
# HyperEVM has no fast lane; both thresholds are free (measured).
fees = [
  { finalityThreshold = 1000, minimumFee = 0 },
  { finalityThreshold = 2000, minimumFee = 0 },
]
