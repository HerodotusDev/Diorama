# The STAGING Mainnet Mirror instance: fully committed — this deployment
# does not depend on a gitignored specialization.toml (its product scope is
# the committed `specialization.toml` beside this file). Deployed by the
# staging anvil layer (k8s/stg-anvil) into daloc-diorama-stg, where the
# whole stack shares one namespace: the ${...} wiring vars resolve to
# same-namespace short service DNS.
[instance]
name = "diorama-staging-mainnet"
namespace = "daloc-diorama-stg"
profile = "mainnet"
project = "specialization"

[chains.l1]
kind = "ethereum"
# The read pool's first entry is the anvil fork source and the
# `/admin/epoch` re-pin target; the engine fans out over the whole group.
source_urls = "@reth"
follow = "latest"
follow_margin_blocks = 2
# Blocks between the follow head and T's fork base. The staging deployment
# pins an explicit `fork_pin` (in the specialization beside this file), so
# this offset is only the restart-drill fallback path — the anvil container
# still requires it to be present even when a pin is configured.
fork_offset = 128

[services.engine]
state_dir = "${STATE_DIR}"

[services.engine.anvil]
target_url = "@anvil_t"

[services.engine.loops]
# The follow's poll interval: 3 s against the remote Alchemy RPC (the cheap
# deployment's rate budget; overrides config/defaults.toml's 1000 ms).
poll_interval_ms = 3000
# Chain-1 catch-up: the staging pin ages ~15k blocks/day against the
# archive source, and the same-pin restart replay walks the gap at apply
# speed — 20k covers a day-old pin with margin.
max_gap_blocks = 20000
# JSON-RPC batch items for source reads and local cheatcode writes. This is
# the deployment's endpoint contract (the live value), not a global default.
chunk_size = 500

[services.engine.journal]
dir = "${STATE_DIR}/journal"

[services.engine.http]
port = 8080
