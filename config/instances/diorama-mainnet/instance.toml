# The generic Mainnet Mirror instance: deployment facts only.
#
# Product-specific scope (watchlist, fixture ownership, probes, endpoint
# groups) lives in `specialization.toml`, which is gitignored;
# `specialization.example.toml` is the tracked template. Endpoint references
# use `@name` and are expanded from `[endpoints]` before validation.
[instance]
name = "diorama-mainnet"
namespace = "daloc-diorama-mainnet"
profile = "mainnet"
project = "specialization"

[chains.l1]
kind = "ethereum"
# The read pool's first entry is the anvil fork source and the
# `/admin/epoch` re-pin target; the engine fans out over the whole group.
source_urls = "@reth"
follow = "latest"
follow_margin_blocks = 2
# Blocks between the follow head and T's fork base; the single home of the
# offset (the anvil init container reads it from this file). An explicit fork
# base, when the deployment pins one, lives in the specialization's
# [chains.l1] as `fork_pin`.
fork_offset = 128

[services.engine]
state_dir = "${STATE_DIR}"

[services.engine.anvil]
target_url = "@anvil_t"

[services.engine.loops]
# The follow's poll interval: 3 s against the remote Alchemy RPC (the cheap
# deployment's rate budget; overrides config/defaults.toml's 1000 ms).
poll_interval_ms = 3000
# Chain-1 catch-up: the live gap is ~3.3k blocks; the bound also sizes a
# same-pin restart's replay (the fork pin ages ~15k blocks/day against the
# archive source, and the replay walks it at apply speed) — 20k covers a
# day-old pin with margin.
max_gap_blocks = 20000
# JSON-RPC batch items for source reads and local cheatcode writes. This is
# the deployment's endpoint contract (the live value), not a global default.
chunk_size = 500

[services.engine.journal]
dir = "${STATE_DIR}/journal"

[services.engine.http]
port = 8080
