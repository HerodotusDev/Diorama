# Persistent volumes for the Venue Mirror. One file per mirror's claims,
# because a kustomize overlay composes whole files and the venue overlay must
# not declare the mainnet claims.
#
# The cluster's default `local-path` StorageClass (a tenant cannot create
# StorageClasses); claims are dynamically provisioned (no pre-bound
# volumeName). local-path's reclaimPolicy is Delete - deleting a PVC deletes
# the underlying data.
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: anvil-v-state
  labels: { app.kubernetes.io/part-of: diorama-venue, app: anvil-v }
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local-path
  resources:
    requests:
      # V forks the source on demand and carries only the devnet's own writes
      # (T's measured working set is ~2.5 GB); 10Gi is comfortable.
      storage: 10Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: venue-sim-state
  labels: { app.kubernetes.io/part-of: diorama-venue, app: venue-sim }
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local-path
  resources:
    requests:
      # sim.json + feed.json: small JSON state, 2Gi is plenty.
      storage: 2Gi
---
# Shared by profiles: PVCs are namespaced, so the venue instance
# carries its own claim of the same name/shape as the mainnet mirror's.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: engine-state
  labels: { app.kubernetes.io/part-of: diorama-venue, app: engine }
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local-path
  resources:
    requests:
      storage: 5Gi
