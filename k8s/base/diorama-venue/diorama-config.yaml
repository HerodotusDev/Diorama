# Shared runtime wiring for the Venue Mirror stack: the venue wiring env the
# instance TOML references as ${...}. Operational tunables live
# in config/instances/*.toml; this ConfigMap carries only deployment wiring,
# and the config loader is their only reader.
apiVersion: v1
kind: ConfigMap
metadata:
  name: diorama-config
  labels:
    app.kubernetes.io/part-of: daloc-diorama-venue
data:
  # Two HyperEVM planes, deliberately separate:
  #   HL_RPC_URL  - anvil-v's fork source. One URL: anvil takes one
  #                 `--fork-url`. The official endpoint serves historical
  #                 storage at the deployment's pin depth (measured live:
  #                 36 h of fork reads, zero faults, at ~200k blocks behind
  #                 the head).
  #   HL_RPC_URLS - the engine's read pool: random healthy start, failover on
  #                 a transport/throttle/5xx fault, cool a failed entry down
  #                 for a later round. Only endpoints that answer
  #                 `eth_getSystemTxsByBlockNumber` usefully are listed
  #                 first: the archive returns -32601 for it (the pool now
  #                 fails over past that, but a refuser earns nothing), and
  #                 it measured degraded (compose 2.3s -> 8-13s per window on
  #                 2026-11-09), so it rides last as backup.
  HL_RPC_URL: "https://rpc.hyperliquid.xyz/evm"
  HL_RPC_URLS: "https://rpc.hyperliquid.xyz/evm,https://rpc.hypurrscan.io,https://hyperliquid-json-rpc.stakely.io,https://hyperliquid.api.onfinality.io/evm/public,https://rpc.hyperlend.finance/archive"

  # The venue's market plane. Both are URL lists in the instance's
  # [endpoints] groups; the env carries the deployment values, never a second
  # literal in the TOML.
  HL_INFO_API_URL: "https://api.hyperliquid.xyz"
  HL_WS_API_URL: "wss://api.hyperliquid.xyz/ws"

  # The devnet chain and the engine's admin base, by in-namespace service DNS.
  ANVIL_V_URL: "http://anvil-v:8545"
  ENGINE_ADMIN_URL: "http://engine:8080"

  # The Ethereum fork the CCTP bridge burns on: anvil-t lives in the
  # daloc-diorama-mainnet namespace (the venue namespace has no T of its own),
  # so the bridge reaches it over cross-namespace service DNS.
  T_RPC_URL: "http://anvil-t.daloc-diorama-mainnet.svc.cluster.local:8545"

  # State roots on the pods' own PVCs (paths, not claims).
  STATE_DIR: "/state"
  SIM_STATE_DIR: "/state"
  CCTP_STATE_DIR: "/state"
