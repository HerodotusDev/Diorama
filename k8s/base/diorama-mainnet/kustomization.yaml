# The Mainnet Mirror's manifest base: the devnet Anvil (forked off the remote
# Alchemy RPC) and the engine. The namespace, the instance ConfigMap and the
# harness NodePorts are the overlay's (instance identity/topology, not service
# templates) — the same split as k8s/base/diorama-venue.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - diorama-config.yaml
  - pvcs.yaml
  - anvil-t.yaml
  - engine.yaml
