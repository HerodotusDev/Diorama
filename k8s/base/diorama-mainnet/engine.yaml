# engine - the Mainnet Mirror engine: the BAL applier (T), the shadow scan,
# the state probes, the feed bridge, and the admin surface (/admin/epoch,
# /admin/shadow, /admin/feed, /admin/time, /admin/rewind).
#
# Same shape as the venue engine deployment: the image carries the mainnet
# binary, the mounted instance file selects the profile, and the
# state (cursor, journal, shadow registry, drift log) lives on the engine-state
# PVC so restarts resume where they left.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: engine
  labels:
    app.kubernetes.io/name: engine
    app.kubernetes.io/part-of: diorama-mainnet
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: engine
  template:
    metadata:
      labels:
        app.kubernetes.io/name: engine
        app.kubernetes.io/part-of: diorama-mainnet
    spec:
      terminationGracePeriodSeconds: 30
      # amd64-only images; the cluster carries arm64 nodes too.
      nodeSelector:
        kubernetes.io/arch: amd64
      imagePullSecrets:
        - name: ghcr-diorama
      containers:
        - name: engine
          image: ghcr.io/herodotusdev/diorama-mainnet-engine:v18
          imagePullPolicy: IfNotPresent
          args: ["run", "--config", "/etc/mirror/instance.toml"]
          # The wiring the instance TOML references as ${...} (RETH_URL,
          # ANVIL_T_URL, STATE_DIR).
          envFrom:
            - configMapRef: { name: diorama-config }
          env:
            # The Alchemy key is deploy-time data (Secret `alchemy`, created by
            # the operator); the fork URL is composed from it. ALCHEMY_KEY must
            # be listed BEFORE RETH_URL for the dependent $(...) expansion.
            - name: ALCHEMY_KEY
              valueFrom: { secretKeyRef: { name: alchemy, key: ALCHEMY_KEY } }
            - name: RETH_URL
              value: "https://eth-mainnet.g.alchemy.com/v2/$(ALCHEMY_KEY)"
          ports:
            - { name: http, containerPort: 8080 }
          volumeMounts:
            - { name: instance, mountPath: /etc/mirror, readOnly: true }
            - { name: state, mountPath: /state }
          # `/livez`, not `/healthz`: the engine's healthz reports its own
          # state (503 while paused), and probing it would drop the pod (and
          # its NodePort) out of rotation — and eventually restart it — in the
          # middle of a documented pause drill, while the contract says a
          # paused engine keeps serving reads and writes.
          # The boot-wait may outlast a dependency's own restart (the
          # engines wait for their anvil, the bridge for two chains): a
          # startupProbe suspends the liveness/readiness probes through it, so
          # a coordinated rollout never kills a booting container.
          # The 90 x 10 s window (15 min) covers a slow anvil re-fork.
          startupProbe:
            httpGet: { path: /livez, port: 8080 }
            periodSeconds: 10
            failureThreshold: 90
          readinessProbe:
            # `/livez`, not `/healthz`: a gap-paused engine is still serving
            # reads/writes (it is catching up, not dead), so it must stay in
            # the Service. `/healthz` is the diagnostic state report (200 ok,
            # 503 halted/gap-paused); probing it here took the engine out of
            # rotation for the whole catch-up and starved its admin consumers.
            httpGet: { path: /livez, port: 8080 }
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /livez, port: 8080 }
            initialDelaySeconds: 30
            periodSeconds: 30
          resources:
            # No CPU limit (the applier's passes are latency-sensitive).
            # Measured 2026-10-31 (60 s sample): ~3-4m CPU, 22-24 MiB RSS. The
            # request tracks the measured steady state; the limit stays the OOM
            # ceiling for a wide window's composition state.
            requests: { cpu: "5m", memory: 32Mi }
            # 2026-11-06: the 512Mi ceiling OOMed during a wide-window
            # composition (exit 137 at 13:50Z). The venue engine was already
            # raised to 2Gi for the same reason; match it. The applier is
            # stateless and resumes from the journal.
            limits: { memory: 2Gi }
      volumes:
        - name: instance
          configMap: { name: mainnet-instance }
        - name: state
          persistentVolumeClaim: { claimName: engine-state }
---
apiVersion: v1
kind: Service
metadata:
  name: engine
  labels: { app.kubernetes.io/name: engine, app.kubernetes.io/part-of: diorama-mainnet }
spec:
  selector: { app.kubernetes.io/name: engine }
  ports:
    - { name: http, port: 8080, targetPort: 8080 }
