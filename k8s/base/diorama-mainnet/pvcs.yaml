# Persistent volumes for the mirror. All use the cluster's default
# `local-path` StorageClass (a tenant cannot create StorageClasses) and are
# dynamically provisioned (no pre-bound volumeName).
#
# This file is the mainnet mirror's claims; the Venue Mirror's live in
# diorama-venue/pvcs.yaml - one file per mirror, because a kustomize overlay
# composes whole files and must not declare the other mirror's claims.
#
# NOTE: local-path's reclaimPolicy is Delete - deleting a PVC deletes the
# underlying data. Back up before destructive namespace surgery.
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: anvil-t-state
  labels: { app.kubernetes.io/part-of: diorama-mainnet, app: anvil-t }
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local-path
  resources:
    requests:
      storage: 20Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: engine-state
  labels: { app.kubernetes.io/part-of: diorama-mainnet, app: engine }
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local-path
  resources:
    requests:
      storage: 5Gi
