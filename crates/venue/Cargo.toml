[package]
name = "diorama-venue"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "The Venue Mirror: the fork driver over anvil V, the market/account simulator, the consumer-facing API"

[dependencies]
diorama-config = { path = "../config" }
diorama-anvil = { path = "../anvil" }
diorama-devnet = { path = "../devnet" }
alloy-consensus = { workspace = true }
# "k256": `/exchange` recovers an action's signer from its signature (api/signing.rs).
alloy-primitives = { workspace = true, features = ["k256"] }
alloy-rpc-types-eth = { workspace = true }
alloy-rpc-types-trace = { workspace = true }
alloy-sol-types = { workspace = true }
axum = { workspace = true, features = ["ws"] }
base64 = { workspace = true }
flate2 = { workspace = true }
clap = { workspace = true }
futures-util = { workspace = true }
reqwest = { workspace = true }
rust_decimal = { workspace = true }
serde = { workspace = true }
# "raw_value": the signed action is hashed exactly as the client sent it (api/signing.rs).
serde_json = { workspace = true, features = ["raw_value"] }
thiserror = { workspace = true }
tokio = { workspace = true }
tokio-tungstenite = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
# Signs test actions as a client's agent key would (api/exchange.rs tests).
k256 = { version = "0.13", features = ["ecdsa"] }

[lints]
workspace = true
